version: 2

# Wöchentliche Updates der Abhängigkeiten als Pull Requests. Kleine Updates (Minor, Patch) kommen gebündelt;
# große Sprünge (zum Beispiel Laravel 14) bekommen einen eigenen Pull Request und werden nie automatisch gemergt.
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [chore]
    groups:
      composer-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [chore]
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [chore]
