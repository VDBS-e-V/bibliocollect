name: Komponentenbibliothek

on:
  pull_request:
    paths:
      - 'resources/views/components/**'
      - 'resources/views/pages/partials/design-lab-**'
      - 'resources/css/**'
      - 'resources/js/**'
      - 'tests/Feature/ComponentLibrary*'
      - '.github/workflows/components.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: components-${{ github.ref }}
  cancel-in-progress: true

jobs:
  components:
    name: Komponenten-Regression (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: npm run build
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: touch database/database.sqlite
      - run: php artisan migrate --force
      - name: Komponenten- und Galerie-Tests
        run: ./vendor/bin/pest tests/Feature/ComponentLibrary*Test.php --colors=always
